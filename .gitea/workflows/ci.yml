# Linux baseline of the fork (XBA-13): the toolkit builds, every C test project under tests/ and consoles/*/tests/ passes
# or skips (exit 77), and the Python suite (pytest tools/ consoles/) passes -- all inside tools/docker/linux.Dockerfile.
# The console runtimes (XBA-146) ride in the same linux and linux-arm64 jobs: no job of their own on the shared host.
# Runs on the Coolify host's Docker (job container with the Docker CLI only), like Table Factory's CI; the host's
# layer cache keeps the apt / pip layers between runs. The last step prints the C test report.
#
# Gating (XBA-53, docs/android/toolchain.md « CI gating »):
#   pull request   linux, then android-toolkit (NDK compile, app unit tests) when the PR touches the Android build
#   push to main   linux, then linux-arm64 (fails on a failure not in tools/ci/arm64-expected.txt), then android-image,
#                  then android-toolchain (rebuilt only when its key changes, XBA-125), then android-apk (xrecomp-latest)
#   both           homebrew after linux (XBA-149: the GBA / PS1 / N64 test corpus, then the GBA programs as recompiled
#                  packs with screenshots, XBA-180; on PRs only when it is touched)
#   weekly         linux, then device-tests (the device test bundle; fails when a project stops building)
# Heavy jobs (everything but linux) take tools/ci/heavy_lock.sh: one at a time on the shared host, queued, never
# cancelled. Gitea's `concurrency:` keeps one pending job per group and cancels the others, hence the lock.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore: ['.claude/**', 'CLAUDE.md']
  schedule:
    - cron: '30 2 * * 1'   # Monday night: device-tests
  workflow_dispatch:
    inputs:
      device_tests:
        description: 'Also build the device test bundle (device-tests job, about 12 min)'
        type: boolean
        default: false
      homebrew_oracles:
        description: 'Also run the homebrew corpus in PCSX-Redux and ares (homebrew job; 20 min cold, 2 min cached)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # XBA-100: the runner is the maintainers' shared host and every job drives its Docker, so a pull request from a fork
  # (someone else's code) never runs here; a maintainer pushes the branch to this repository to test it. Every other
  # job needs linux, so this one guard stops them all.
  linux:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    container:
      image: docker:29.8.1-cli
    env:
      # per-run tag: runs share the host's Docker, so a run's cleanup never removes another run's image
      TEST_TAG: xba-linux:${{ github.run_id }}
    steps:
      # By hand: there is no Node in this image for actions/checkout.
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git >/dev/null
          git init -q .
          git fetch -q --depth 1 "$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format='%h %s'

      - name: Build and test (Docker)
        run: docker build -f tools/docker/linux.Dockerfile --target test --progress=plain -t "$TEST_TAG" .

      # On a failure the per-project lines are in the build log above.
      - name: C test report
        run: docker run --rm "$TEST_TAG" cat /reports/c-tests.md

      - name: Clean up
        if: always()
        run: docker rmi "$TEST_TAG" >/dev/null 2>&1 || true

  # XBA-53: a PR that breaks the NDK build goes red before the merge. The toolkit target of android.Dockerfile
  # (compile only, JOBS=4, after linux, under the heavy-job lock), only when the PR touches what it is built from;
  # other PRs pass through in seconds. The Android image layers are cached on the host: a few minutes.
  android-toolkit:
    needs: linux
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: docker:29.8.1-cli
    env:
      IMAGE_TAG: xba-android-pr:${{ github.run_id }}
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git >/dev/null
          git init -q .
          git fetch -q --depth 1 "$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # The PR's files, from the merge base (Gitea puts it in the event). A cheap step: two depth-1 fetches and a
      # tree diff. If the merge base cannot be had, the compile runs (better a few minutes than a miss).
      - name: Does the PR touch the Android build?
        id: paths
        env:
          TOKEN: ${{ github.token }}
          MERGE_BASE: ${{ github.event.pull_request.merge_base }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          url="$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git"
          base=${MERGE_BASE:-$BASE_SHA}
          if [ -n "$base" ] && git fetch -q --depth 1 "$url" "$base" 2>/dev/null \
             && files=$(git diff --name-only "$base" HEAD); then
            echo "Changed since $(printf '%.8s' "$base"):"; printf '%s\n' "$files" | sed 's/^/  /'
            if printf '%s\n' "$files" | grep -qE '^(src/|include/|android/|cmake/|CMakeLists\.txt$|tools/docker/android\.Dockerfile$|tools/docker/gradle-central-mirror\.gradle$|\.gitea/workflows/ci\.yml$)'; then
              echo "android=true" >> "$GITHUB_OUTPUT"
            else
              echo "Nothing the Android toolkit is built from: compile skipped."
              echo "android=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No merge base to diff against: compiling anyway."
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the heavy-job lock
        if: steps.paths.outputs.android == 'true'
        run: sh tools/ci/heavy_lock.sh acquire

      - name: Toolkit for arm64-v8a (NDK, API 30)
        if: steps.paths.outputs.android == 'true'
        run: |
          docker build -f tools/docker/android.Dockerfile --target toolkit --build-arg JOBS=4 --progress=plain \
            -t "$IMAGE_TAG" .
          docker run --rm "$IMAGE_TAG" cat /reports/android-artefacts.txt

      # The app's JVM unit tests (Robolectric: launcher Prepare screens, PrepareService, pack check, tool install).
      # About 1 min with the dependency layer cached (2 min cold); only the result folder leaves BuildKit.
      - name: App unit tests (Robolectric)
        if: steps.paths.outputs.android == 'true'
        run: |
          docker build -f tools/docker/android.Dockerfile --target app-unit-tests-out --progress=plain \
            --output type=local,dest=out-unit .
          cat out-unit/app-unit-tests.txt

      - name: Clean up
        if: always()
        run: |
          docker rmi "$IMAGE_TAG" >/dev/null 2>&1 || true
          rm -rf out-unit
          sh tools/ci/heavy_lock.sh release || true

  # XBA-149: the homebrew test corpus of the other consoles (consoles/{gba,ps1,n64}/tests/homebrew, our own programs,
  # no game data) still builds with the pinned toolchains (tools/docker/<console>-homebrew.Dockerfile). After linux,
  # under the heavy-job lock; on a PR only when it touches the corpus, its Dockerfiles, its scripts or this file, on
  # every push to main. The toolchain images keep the stable tags xba-<console>-homebrew so the host's layer cache
  # keeps them between runs (a few seconds when nothing changed, about 10 min cold, mostly libdragon). The binaries
  # stay in the job container and are deleted with it: only their SHA256SUMS are printed, nothing is published.
  # Run by hand with homebrew_oracles ticked, it also checks every PS1 / N64 program's verdict in an emulator.
  # XBA-180: the GBA programs then go through the user chain (tools/consoles/run_gba_packs.sh, in the linux job's
  # deps image, about 30 s cached): ctest gba_hb_* / gba_rc_hb_* (skipped in the linux job, which has no corpus), and
  # each program prepared into a pack (python3 -m tools.prepare), run headless until its verdict, screenshotted; the
  # screenshots' sha256 must match consoles/gba/tests/corpus_screens.sha256. The PNGs are kept as the run's artefact
  # gba-corpus-screens. That part also runs when a PR touches the GBA runtime, lifter or Prepare.
  # XBA-193: it also gets the Cult-of-GBA BIOS (MIT, built from source) and jsmolka/gba-tests (MIT), kept in the
  # host's Docker as the data image xba-gba-inputs:<hash of the pins> (tools/consoles/gba_test_inputs.sh: about a
  # second cached, a few seconds cold), and runs ctest gba_hb_lle_* / gba_jsmolka_* and their gba_rc_* too (30 tests,
  # about 11 s). They are inputs only: never uploaded with the artefact. XBA-201: the image also holds the mGBA test
  # suite (MIT, built from source by tools/consoles/build_gba_suite.sh) for ctest gba_mgba* / gba_rc_mgba (pass counts).
  # The N64 programs go through consoles/n64/tests the same way (tools/consoles/run_n64_homebrew.sh, same deps image,
  # about 100 s cached): ctest n64_runtime / n64_pack / n64_hb_* / n64_rc_hb_* / n64_(rc_)state_* / n64_rewind_hb_*
  # / n64_cheats_hb_* (29 tests, skipped in the linux job). That part also runs when a PR touches consoles/n64/.
  homebrew:
    needs: linux
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    container:
      image: docker:29.8.1-cli
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git >/dev/null
          git init -q .
          git fetch -q --depth 1 "$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # Same diff as android-toolkit's: if the merge base cannot be had, the corpus builds anyway.
      - name: Does the PR touch the homebrew corpus?
        id: paths
        env:
          TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MERGE_BASE: ${{ github.event.pull_request.merge_base }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "build=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          url="$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git"
          base=${MERGE_BASE:-$BASE_SHA}
          if [ -n "$base" ] && git fetch -q --depth 1 "$url" "$base" 2>/dev/null \
             && files=$(git diff --name-only "$base" HEAD); then
            if printf '%s\n' "$files" | grep -qE '^(consoles/[^/]+/tests/homebrew/|consoles/gba/|consoles/n64/|tools/prepare/|tools/docker/((gba|ps1|n64)-homebrew|linux)\.Dockerfile$|tools/consoles/(build_homebrew\.sh|run_gba_packs\.sh|gba_corpus_packs\.py|gba_recomp_build\.py|gba_test_inputs\.sh|build_gba_bios\.sh|fetch_gba_tests\.sh|build_gba_suite\.sh|run_n64_homebrew\.sh|build_n64_libdragon_tests\.sh)$|\.gitea/workflows/ci\.yml$)'; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "Nothing the homebrew corpus is built from: skipped."
              echo "build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No merge base to diff against: building anyway."
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the heavy-job lock
        if: steps.paths.outputs.build == 'true'
        run: sh tools/ci/heavy_lock.sh acquire

      - name: Build the corpus (GBA, PS1, N64)
        if: steps.paths.outputs.build == 'true'
        run: |
          apk add --no-cache bash coreutils tar >/dev/null
          JOBS=4 bash tools/consoles/build_homebrew.sh all out/homebrew
          for c in gba ps1 n64; do echo "== $c"; cat "out/homebrew/$c/SHA256SUMS"; done

      # A changed screenshot: look at the artefact's PNG; if the change is intended, rewrite the list with
      # tools/consoles/gba_corpus_packs.py CORPUS OUT --gba-run GBA_RUN --update (consoles/README.md).
      - name: GBA test inputs (Cult-of-GBA BIOS, jsmolka/gba-tests; cached)
        if: steps.paths.outputs.build == 'true'
        run: |
          apk add --no-cache curl >/dev/null
          bash tools/consoles/gba_test_inputs.sh out/gba-inputs

      - name: GBA corpus as recompiled packs (Prepare, headless run, screenshots)
        if: steps.paths.outputs.build == 'true'
        run: JOBS=4 bash tools/consoles/run_gba_packs.sh out/homebrew out/gba-packs out/gba-inputs

      # XBA-202: libdragon's test ROM and rsp_inval_instrs (Unlicense), built from source in the N64 toolchain image
      # (a few seconds), run as n64_libdragon_tests / n64_rsp_inval_instrs (about 35 s) in the step below.
      - name: N64 open test ROMs (libdragon testrom, rsp_inval_instrs)
        if: steps.paths.outputs.build == 'true'
        run: |
          apk add --no-cache git >/dev/null
          JOBS=4 bash tools/consoles/build_n64_libdragon_tests.sh out/n64-open

      - name: N64 corpus through the runtime's ctest (interpreter, recompiled in lockstep, states, rewind)
        if: steps.paths.outputs.build == 'true'
        run: JOBS=4 bash tools/consoles/run_n64_homebrew.sh out/homebrew out/n64-homebrew out/n64-open

      # actions/upload-artifact runs on Node, which the docker CLI image does not have.
      - name: Node for the artefact upload
        if: always() && steps.paths.outputs.build == 'true'
        continue-on-error: true
        run: apk add --no-cache nodejs >/dev/null

      - name: Keep the GBA screenshots
        if: always() && steps.paths.outputs.build == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v3
        with:
          name: gba-corpus-screens
          path: |
            out/gba-packs/*.png
            out/gba-packs/*.log
            out/gba-packs/report.md
            out/gba-packs/SHA256SUMS
          retention-days: 30

      # By hand only (workflow_dispatch, homebrew_oracles): the PS1 and N64 programs in their external oracles
      # (tools/consoles/run_homebrew.sh: PCSX-Redux + OpenBIOS, ares), each program's result block must say PASS.
      # The oracle images (xba-ps1-oracle 2.9 GB, xba-n64-oracle 1.7 GB) take about 20 min to build cold, so this
      # does not run on every push; cached, the runs take about 2 min.
      - name: Run the corpus in the oracles (PCSX-Redux, ares)
        if: steps.paths.outputs.build == 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.homebrew_oracles == 'true'
        run: JOBS=4 bash tools/consoles/run_homebrew.sh all out/homebrew

      - name: Clean up
        if: always()
        run: |
          rm -rf out
          sh tools/ci/heavy_lock.sh release || true

  # arm64: cross-compiled, tests under qemu-user (docs/android/baseline-arm64.md). A build break fails the job, and
  # so does a test failure that is not in tools/ci/arm64-expected.txt, or a line there that no longer fails (XBA-53):
  # the Docker build prints the report and runs tools/ci/check_expected.py.
  #
  # The qemu and Android SDK jobs run only on pushes to main or by hand, chained, and under the heavy-job lock across
  # runs: on 2026-11-09 the first PR running them in parallel saturated the shared Proxmox storage (Gitea and Plane
  # stopped answering). On PRs only the toolkit compile runs (android-toolkit).
  linux-arm64:
    needs: linux
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    container:
      image: docker:29.8.1-cli
    env:
      TEST_TAG: xba-linux-arm64:${{ github.run_id }}
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git >/dev/null
          git init -q .
          git fetch -q --depth 1 "$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # One heavy job at a time on the shared host (XBA-53): waits here, never cancelled.
      - name: Wait for the heavy-job lock
        run: sh tools/ci/heavy_lock.sh acquire

      - name: Cross-build and test under qemu (Docker)
        run: docker build -f tools/docker/linux-arm64.Dockerfile --target test --progress=plain -t "$TEST_TAG" .

      - name: arm64 C test report
        run: docker run --rm "$TEST_TAG" cat /reports/c-tests.md

      - name: Clean up
        if: always()
        run: |
          docker rmi "$TEST_TAG" >/dev/null 2>&1 || true
          sh tools/ci/heavy_lock.sh release || true

  # The Android toolchain image (docs/android/toolchain.md) builds, and its NDK builds SDL2 for arm64-v8a / API 30.
  android-image:
    needs: linux-arm64
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    container:
      image: docker:29.8.1-cli
    env:
      IMAGE_TAG: xba-android:${{ github.run_id }}
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git >/dev/null
          git init -q .
          git fetch -q --depth 1 "$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # One heavy job at a time on the shared host (XBA-53): waits here, never cancelled.
      - name: Wait for the heavy-job lock
        run: sh tools/ci/heavy_lock.sh acquire

      - name: Build the image
        run: docker build -f tools/docker/android.Dockerfile --target android --progress=plain -t "$IMAGE_TAG" .

      - name: Smoke test (SDL2 for arm64-v8a, API 30)
        run: |
          docker run --rm "$IMAGE_TAG" bash -c '
            cat /etc/xba-toolchain.txt
            cmake -S "$SDL2_SRC" -B /tmp/sdl -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=30 >/dev/null
            cmake --build /tmp/sdl -j4 >/dev/null
            file /tmp/sdl/libSDL2.so | tee /dev/stderr | grep -q "ARM aarch64, version 1 (SYSV), dynamically linked, for Android 30"'

      # XBA-17: every toolkit library builds for arm64-v8a, SDL2 from the pinned sources, no desktop dependency.
      - name: Toolkit for arm64-v8a (NDK, API 30)
        run: |
          docker build -f tools/docker/android.Dockerfile --target toolkit --progress=plain -t "$IMAGE_TAG-toolkit" .
          docker run --rm "$IMAGE_TAG-toolkit" cat /reports/android-artefacts.txt

      # XBA-18: the app shell APK (debug-signed; no game code in it).
      - name: App shell APK
        run: |
          docker build -f tools/docker/android.Dockerfile --target apk --build-arg XBA_VERSION="${GITHUB_SHA:0:8}" \
            --progress=plain -t "$IMAGE_TAG-apk" .
          docker run --rm "$IMAGE_TAG-apk" cat /out/apk-contents.txt
          mkdir -p out && cid=$(docker create "$IMAGE_TAG-apk") && docker cp "$cid:/out/xboxrecomp-shell.apk" out/ \
            && docker rm "$cid" >/dev/null && ls -la out

      # XBA-20: the shell APK of the latest main, as the rolling prerelease « shell-latest » (one at a time).
      # No game content anywhere: the repo, the image and this job only ever hold the toolkit and the shell.
      - name: Publish the shell APK (shell-latest)
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache curl jq >/dev/null
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $TOKEN"
          sha8=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)
          old=$(curl -fsS -H "$auth" "$api/releases/tags/shell-latest" 2>/dev/null | jq -r '.id // empty' || true)
          if [ -n "$old" ]; then
            curl -fsS -X DELETE -H "$auth" "$api/releases/$old"
            curl -fsS -X DELETE -H "$auth" "$api/tags/shell-latest" || true
          fi
          body=$(jq -n --arg sha "$GITHUB_SHA" --arg s "$sha8" \
            '{tag_name: "shell-latest", target_commitish: $sha, name: ("App shell, latest main (" + $s + ")"), prerelease: true,
              body: ("The Android app shell built by CI from main at " + $s + ". No game inside. Debug-signed, arm64-v8a, Android 11+. Its own application id (fr.adserver.xrecomp.dev, « XRecomp shell »): it installs next to the XRecomp APK of xrecomp-latest, never over it.\n\nInstall: adb install -r xboxrecomp-shell-" + $s + ".apk. Check list: docs/android/app-shell.md.")}')
          id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" -d "$body" "$api/releases" | jq -r .id)
          curl -fsS -X POST -H "$auth" -F "attachment=@out/xboxrecomp-shell.apk;type=application/vnd.android.package-archive" \
            "$api/releases/$id/assets?name=xboxrecomp-shell-$sha8.apk" | jq -r .browser_download_url

      # XBA-52: the stub title (templates/new-game around the synthetic XBE of tools/conformance, lifted by the
      # pipeline) linked into the shell: the first end-to-end link of generated C for Android. Its APK and the
      # synthetic XBE (ours, no game content) go next to the shell APK in « shell-latest », for the device check.
      - name: Stub title APK
        env:
          TOKEN: ${{ github.token }}
        run: |
          trap 'docker rmi "$IMAGE_TAG-stub" >/dev/null 2>&1 || true; rm -rf out-stub' EXIT
          docker build -f tools/docker/android.Dockerfile --target stub-apk --build-arg XBA_VERSION="${GITHUB_SHA:0:8}" \
            --progress=plain -t "$IMAGE_TAG-stub" .
          docker run --rm "$IMAGE_TAG-stub" cat /out/stub-apk-contents.txt
          mkdir -p out-stub && cid=$(docker create "$IMAGE_TAG-stub") \
            && docker cp "$cid:/out/xboxrecomp-stub.apk" out-stub/ && docker cp "$cid:/out/stub-default.xbe" out-stub/ \
            && docker rm "$cid" >/dev/null
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $TOKEN"
          sha8=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)
          id=$(curl -fsS -H "$auth" "$api/releases/tags/shell-latest" | jq -r .id)
          curl -fsS -X POST -H "$auth" -F "attachment=@out-stub/xboxrecomp-stub.apk;type=application/vnd.android.package-archive" \
            "$api/releases/$id/assets?name=xboxrecomp-stub-$sha8.apk" | jq -r .browser_download_url
          curl -fsS -X POST -H "$auth" -F "attachment=@out-stub/stub-default.xbe;type=application/octet-stream" \
            "$api/releases/$id/assets?name=stub-default.xbe" | jq -r .browser_download_url

      - name: Clean up
        if: always()
        run: |
          docker rmi "$IMAGE_TAG" "$IMAGE_TAG-toolkit" "$IMAGE_TAG-apk" >/dev/null 2>&1 || true
          rm -rf out
          sh tools/ci/heavy_lock.sh release || true

  # XBA-125: the on-device toolchain of the Prepare (LLVM, CPython, capstone: docs/android/toolchain.md) is built only
  # when its cache key changes: tools/ci/toolchain_key.sh hashes tools/android/toolchain/ (versions.env, the scripts)
  # and the toolchain stages of android.Dockerfile. The result is kept as the asset of the prerelease
  # « toolchain-<key> » on this Gitea, which outlives the host's Docker cache (pruned when the disk fills). On a hit
  # this job takes seconds and no lock. On a miss (about 35 min) it builds under the heavy-job lock, CPython then LLVM,
  # one after the other at JOBS=4 each (not side by side as one BuildKit build would run them), with no tmpfs, and
  # publishes the archive with the licence texts of what it holds.
  android-toolchain:
    needs: android-image
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    container:
      image: docker:29.8.1-cli
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git >/dev/null
          git init -q .
          git fetch -q --depth 1 "$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      - name: Is the toolchain cached?
        id: cache
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache curl jq >/dev/null
          key=$(sh tools/ci/toolchain_key.sh)
          echo "key=$key" >> "$GITHUB_OUTPUT"
          # 404: not cached. Any other failure stops here rather than start a 35-minute build for nothing.
          http=$(curl -sS -o rel.json -w '%{http_code}' -H "Authorization: token $TOKEN" \
                   "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases/tags/toolchain-$key")
          case "$http" in
            200) n=$(jq --arg a "xba-toolchain-$key.tar.xz" \
                       '[.assets[]? | select(.name == $a or .name == ($a + ".sha256"))] | length' rel.json) ;;
            404) n=0 ;;
            *) echo "Gitea API answered $http for releases/tags/toolchain-$key"; exit 1 ;;
          esac
          rm -f rel.json
          if [ "$n" = 2 ]; then
            echo "Toolchain $key is cached (release toolchain-$key): nothing to build."
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "Toolchain $key is not cached: building it (about 35 min)."
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the heavy-job lock
        if: steps.cache.outputs.hit != 'true'
        run: sh tools/ci/heavy_lock.sh acquire

      # check.sh runs in the toolchain stage: aarch64 ELFs, clang under qemu-aarch64, the stub title's pack.
      - name: Build the toolchain (CPython + capstone, then LLVM)
        if: steps.cache.outputs.hit != 'true'
        run: |
          docker build -f tools/docker/android.Dockerfile --target toolchain-python --build-arg JOBS=4 --progress=plain .
          docker build -f tools/docker/android.Dockerfile --target toolchain-out --build-arg JOBS=4 --progress=plain \
            --output type=local,dest=out/toolchain .
          tail -n 20 out/toolchain/check.txt

      - name: Publish the toolchain (toolchain-<key>)
        if: steps.cache.outputs.hit != 'true'
        env:
          TOKEN: ${{ github.token }}
          KEY: ${{ steps.cache.outputs.key }}
        run: |
          apk add --no-cache xz >/dev/null
          mkdir -p out/toolchain/LICENSES
          cp LICENSE NOTICE out/toolchain/ && cp LICENSES/*.txt out/toolchain/LICENSES/
          a="xba-toolchain-$KEY.tar.xz"
          tar -C out/toolchain -cf - . | xz -T2 -6 > "out/$a"
          (cd out && sha256sum "$a" > "$a.sha256" && cat "$a.sha256" && ls -la "$a")
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $TOKEN"
          old=$(curl -fsS -H "$auth" "$api/releases/tags/toolchain-$KEY" 2>/dev/null | jq -r '.id // empty' || true)
          if [ -n "$old" ]; then   # a partial upload of a failed run
            curl -fsS -X DELETE -H "$auth" "$api/releases/$old"
            curl -fsS -X DELETE -H "$auth" "$api/tags/toolchain-$KEY" || true
          fi
          body=$(jq -n --arg k "$KEY" --arg s "$GITHUB_SHA" \
            '{tag_name: ("toolchain-" + $k), target_commitish: $s, name: ("On-device toolchain " + $k), prerelease: true,
              body: ("CI cache of the toolchain-out stage of tools/docker/android.Dockerfile (CPython, capstone, clang + lld for arm64-v8a, Android 30), key " + $k + " (tools/ci/toolchain_key.sh), built at " + $s + ". The XRecomp APK job takes it from here. Licence texts inside (LICENSE, NOTICE, LICENSES/). No game content.")}')
          id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" -d "$body" "$api/releases" | jq -r .id)
          for f in "$a" "$a.sha256"; do
            curl -fsS -X POST -H "$auth" -F "attachment=@out/$f;type=application/octet-stream" \
              "$api/releases/$id/assets?name=$f" | jq -r .browser_download_url
          done
          # The older toolchains are not needed any more (the APK job only takes the current key).
          curl -fsS -H "$auth" "$api/releases?limit=50" \
            | jq -r --arg t "toolchain-$KEY" '.[] | select((.tag_name | startswith("toolchain-")) and .tag_name != $t) | "\(.id) \(.tag_name)"' \
            | while read -r rid tag; do
                echo "Removing the old $tag"
                curl -fsS -X DELETE -H "$auth" "$api/releases/$rid" && curl -fsS -X DELETE -H "$auth" "$api/tags/$tag" || true
              done

      - name: Clean up
        if: always()
        run: |
          rm -rf out
          sh tools/ci/heavy_lock.sh release || true

  # XBA-125: the XRecomp APK, what a player installs: the release build of the app with the toolchain above inside
  # (Prepare), optimised native code, debuggable (run-as for the device check lists), version code = commit time in
  # minutes (so each main build updates the previous one in place). Published as the rolling prerelease
  # « xrecomp-latest » (xrecomp-<commit>.apk). Signed with the release key from the repository secrets
  # XBA_RELEASE_KEYSTORE_B64 (base64 of the PKCS12 keystore), XBA_RELEASE_KEYSTORE_PASSWORD and, optional,
  # XBA_RELEASE_KEY_ALIAS (default xrecomp); they reach Gradle as BuildKit secrets, never as build args or layers.
  # Without them the APK is debug-signed, with a warning in the log and in the release notes
  # (docs/android/toolchain.md « Signing »).
  android-apk:
    needs: android-toolchain
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    container:
      image: docker:29.8.1-cli
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git >/dev/null
          git init -q .
          git fetch -q --depth 1 "$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # One heavy job at a time on the shared host (XBA-53): waits here, never cancelled.
      - name: Wait for the heavy-job lock
        run: sh tools/ci/heavy_lock.sh acquire

      - name: Fetch the toolchain (toolchain-<key>)
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache curl jq xz >/dev/null
          key=$(sh tools/ci/toolchain_key.sh)
          a="xba-toolchain-$key.tar.xz"
          rel=$(curl -fsS -H "Authorization: token $TOKEN" \
                  "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/releases/tags/toolchain-$key")
          mkdir -p out/toolchain
          for f in "$a" "$a.sha256"; do
            url=$(printf '%s' "$rel" | jq -r --arg f "$f" '.assets[] | select(.name == $f) | .browser_download_url')
            [ -n "$url" ] || { echo "toolchain-$key has no $f"; exit 1; }
            curl -fsSL -u "ci:$TOKEN" -o "out/$f" "$url"
          done
          (cd out && sha256sum -c "$a.sha256")
          xz -dc "out/$a" | tar -C out/toolchain -xf -
          rm "out/$a"
          ls -la out/toolchain/jniLibs/arm64-v8a out/toolchain/assets/prepare

      - name: XRecomp APK (release build with the toolchain)
        env:
          KS_B64: ${{ secrets.XBA_RELEASE_KEYSTORE_B64 }}
          XBA_KEYSTORE_PASSWORD: ${{ secrets.XBA_RELEASE_KEYSTORE_PASSWORD }}
          XBA_KEY_ALIAS: ${{ secrets.XBA_RELEASE_KEY_ALIAS }}
        run: |
          sha8=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)
          code=$(( $(git log -1 --format=%ct) / 60 ))
          set --
          if [ -n "$KS_B64" ] && [ -n "$XBA_KEYSTORE_PASSWORD" ]; then
            (umask 077 && mkdir -p sec && printf '%s' "$KS_B64" | base64 -d > sec/release.p12)
            set -- --secret id=xba_keystore,src=sec/release.p12 --secret id=xba_keystore_password,env=XBA_KEYSTORE_PASSWORD
            [ -z "$XBA_KEY_ALIAS" ] || set -- "$@" --secret id=xba_key_alias,env=XBA_KEY_ALIAS
            signing=release
          else
            echo "::warning::XRecomp APK DEBUG-SIGNED: the secrets XBA_RELEASE_KEYSTORE_B64 / XBA_RELEASE_KEYSTORE_PASSWORD are not set. It cannot update a release-signed install (docs/android/toolchain.md, Signing)."
            signing=debug
          fi
          # The APK carries OpenBIOS (XBA-168): the ps1-bios stage of android.Dockerfile builds it from its pinned
          # source in PCSX-Redux's CI image (pinned by digest, pulled once and kept by the host). It reads nothing of
          # the repository, so BuildKit's cache keeps it (about 6 s cold once the image is there), inside this job's
          # heavy lock: no job or lock of its own. --build-context xba-ps1-bios=DIR would hand over a cached copy.
          docker build -f tools/docker/android.Dockerfile --target xrecomp-apk-out --progress=plain \
            --build-context xba-toolchain=out/toolchain "$@" --build-arg JOBS=4 --build-arg XBA_SIGNING="$signing" \
            --build-arg XBA_VERSION="$sha8" --build-arg XBA_VERSION_CODE="$code" --output type=local,dest=out/apk .
          rm -rf sec
          cat out/apk/xrecomp-badging.txt out/apk/xrecomp-signing.txt
          ls -la out/apk

      # No game content anywhere: the APK holds this repository's code, the toolchain and their licences (checked by
      # the xrecomp-apk stage: no XBE but our synthetic self-test).
      - name: Publish the XRecomp APK (xrecomp-latest)
        env:
          TOKEN: ${{ github.token }}
        run: |
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $TOKEN"
          sha8=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)
          signer=$(cat out/apk/xrecomp-signing.txt)
          case "$signer" in
            *"DEBUG key"*) sig="**Debug-signed** (no release key in the CI secrets): it cannot update a release-signed install, and its key changes when the CI image is rebuilt." ;;
            *) sig="Signed with the release key: it updates any earlier xrecomp-latest in place, keeping packs, saves and settings." ;;
          esac
          old=$(curl -fsS -H "$auth" "$api/releases/tags/xrecomp-latest" 2>/dev/null | jq -r '.id // empty' || true)
          if [ -n "$old" ]; then
            curl -fsS -X DELETE -H "$auth" "$api/releases/$old"
            curl -fsS -X DELETE -H "$auth" "$api/tags/xrecomp-latest" || true
          fi
          body=$(jq -n --arg sha "$GITHUB_SHA" --arg s "$sha8" --arg sig "$sig" --arg signer "$signer" \
            '{tag_name: "xrecomp-latest", target_commitish: $sha, name: ("XRecomp, latest main (" + $s + ")"), prerelease: true,
              body: ("XRecomp for Android built by CI from main at " + $s + ": the app with the on-device Prepare (Python, capstone, clang + lld). No game inside. arm64-v8a, Android 11+.\n\n" + $sig + "\n\n```\n" + $signer + "\n```\n\nInstall: open xrecomp-" + $s + ".apk on the device, or adb install -r xrecomp-" + $s + ".apk. Switching from a build signed with another key: docs/android/toolchain.md, Signing.")}')
          id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" -d "$body" "$api/releases" | jq -r .id)
          curl -fsS -X POST -H "$auth" -F "attachment=@out/apk/xrecomp.apk;type=application/vnd.android.package-archive" \
            "$api/releases/$id/assets?name=xrecomp-$sha8.apk" | jq -r .browser_download_url
          printf '%s' "$body" | jq -r .body > out/release-body.md

      # The same rolling prerelease on the public GitHub mirror (docs/releases/README.md): the push mirror copies
      # commits and tags, not releases. Skipped while the secret GH_RELEASE_TOKEN is not set.
      - name: Publish the XRecomp APK on GitHub (xrecomp-latest)
        env:
          GH_TOKEN: ${{ secrets.GH_RELEASE_TOKEN }}
          GH_REPO: ${{ vars.GH_RELEASE_REPO }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "GH_RELEASE_TOKEN not set: no GitHub release"; exit 0; fi
          sha8=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)
          sh tools/ci/github_release.sh xrecomp-latest "$GITHUB_SHA" "XRecomp, latest main ($sha8)" true \
            out/release-body.md "out/apk/xrecomp.apk=xrecomp-$sha8.apk"

      - name: Clean up
        if: always()
        run: |
          rm -rf out sec
          sh tools/ci/heavy_lock.sh release || true

  # XBA-53: the device test bundle (XBA-19) still builds. Weekly at night, or by hand with device_tests ticked;
  # about 12 minutes (every project rebuilds the toolkit). build-report.md says which projects were built for
  # Android; tools/ci/check_expected.py fails the run when one that is not in tools/ci/android-unbuilt.txt was not,
  # or when a listed one builds again. The bundle itself stays in the image (no game content in it either).
  device-tests:
    needs: linux
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.device_tests == 'true')
    runs-on: ubuntu-latest
    container:
      image: docker:29.8.1-cli
    env:
      IMAGE_TAG: xba-device-tests:${{ github.run_id }}
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git >/dev/null
          git init -q .
          git fetch -q --depth 1 "$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # One heavy job at a time on the shared host (XBA-53): waits here, never cancelled.
      - name: Wait for the heavy-job lock
        run: sh tools/ci/heavy_lock.sh acquire

      - name: Device test bundle (NDK, API 30)
        run: |
          docker build -f tools/docker/android.Dockerfile --target device-tests --build-arg JOBS=4 --progress=plain \
            -t "$IMAGE_TAG" .

      - name: Build report, against tools/ci/android-unbuilt.txt
        run: |
          docker run --rm "$IMAGE_TAG" cat /out/build-report.md
          docker run --rm "$IMAGE_TAG" ls -la /out
          docker run --rm -w /src "$IMAGE_TAG" python3 tools/ci/check_expected.py android \
            --expected tools/ci/android-unbuilt.txt --report /out/build-report.md

      - name: Clean up
        if: always()
        run: |
          docker rmi "$IMAGE_TAG" >/dev/null 2>&1 || true
          sh tools/ci/heavy_lock.sh release || true
